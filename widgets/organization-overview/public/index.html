<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:var(--homey-background-color,#ffffff);color-scheme:light dark;--card:var(--homey-background-color,#f4f4f5);--header:var(--homey-background-color,#fafafa);--border:color-mix(in srgb,var(--bg) 88%,#000);--row:#fff;--primary:#232323;--secondary:#747378;--muted:#97969b;--title:#27435c;--positive:#18794e;--negative:#b32632;--soft:color-mix(in srgb,var(--bg) 92%,#000)}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent;color:var(--primary);font:14px/1.28 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{display:grid;grid-template-rows:52px minmax(0,1fr);height:100%;border-radius:17px;overflow:hidden;background:var(--card)}header{display:flex;align-items:center;padding:0 18px;border-bottom:1px solid var(--border);background:var(--header)}.app{width:36px;height:36px;object-fit:contain}h1{margin:0 0 0 auto;color:var(--title);font-size:18px;font-weight:600;white-space:nowrap}#content{min-height:0;overflow-y:auto;padding:10px 12px 12px;scrollbar-width:none}#content::-webkit-scrollbar{display:none}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-bottom:8px}.stat{padding:8px 9px;border:1px solid var(--border);border-radius:11px;background:var(--row);min-width:0}.stat span{display:block;color:var(--secondary);font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stat strong{display:block;margin-top:2px;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.list{display:grid;gap:7px}.row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:9px;align-items:center;padding:8px 10px;border:1px solid var(--border);border-radius:11px;background:var(--row)}.badge{display:grid;place-items:center;width:40px;height:40px;border-radius:10px;background:var(--soft);font-weight:850}.meta{min-width:0}.name{font-weight:780;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{margin-top:2px;color:var(--secondary);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.numbers{text-align:right}.numbers strong{display:block;font-size:15px}.numbers span{display:block;margin-top:2px;font-size:10px}.positive{color:var(--positive)}.negative{color:var(--negative)}.unknown{color:var(--muted)}.state{display:grid;place-items:center;height:100%;padding:20px;text-align:center;color:var(--title)}.error{color:#b32632}
@media(prefers-color-scheme:dark){:root{--bg:#121b2b;--card:#121b2b;--header:#172338;--border:color-mix(in srgb,var(--bg) 84%,#fff);--row:color-mix(in srgb,var(--bg) 92%,#fff);--primary:#f4f4f5;--secondary:#b4c2d3;--muted:#8fa0b6;--title:#a9bdd3;--positive:#6ed7a7;--negative:#ff8a92;--soft:color-mix(in srgb,var(--bg) 86%,#fff)}}

</style></head><body>
<main class="card"><header><img class="app" src="icon.svg" alt=""><h1 id="title">Organisatieoverzicht</h1></header><section id="content"><div class="state">…</div></section></main>
<script>
const LOCALES={en:'en-GB',nl:'nl-NL',de:'de-DE',fr:'fr-FR',it:'it-IT',sv:'sv-SE',no:'nb-NO',es:'es-ES',da:'da-DK',pl:'pl-PL'};const words={nl:{title:'Organisatieoverzicht',orgs:'Organisaties',apps:'Apps',installs:'Installaties',growth:'Groei',devices:'Apparaten',suggestions:'suggesties',review:'review',rating:'rating',empty:'Nog geen organisatie-apps in je App-overzichten.'},en:{title:'Organization Overview',orgs:'Organizations',apps:'Apps',installs:'Installs',growth:'Growth',devices:'Devices',suggestions:'suggestions',review:'review',rating:'rating',empty:'No organization apps in your App overviews yet.'},de:{title:'Organisationsübersicht',orgs:'Organisationen',apps:'Apps',installs:'Installationen',growth:'Wachstum',devices:'Geräte',suggestions:'Vorschläge',review:'in Prüfung',rating:'Bewertung',empty:'Noch keine Organisations-Apps in Ihren App-Übersichten.'},fr:{title:'Aperçu des organisations',orgs:'Organisations',apps:'Apps',installs:'Installations',growth:'Croissance',devices:'Appareils',suggestions:'suggestions',review:'en revue',rating:'note',empty:'Aucune app d\'organisation dans vos Aperçus des apps pour l\'instant.'},it:{title:'Panoramica organizzazioni',orgs:'Organizzazioni',apps:'App',installs:'Installazioni',growth:'Crescita',devices:'Dispositivi',suggestions:'suggerimenti',review:'in revisione',rating:'valutazione',empty:'Ancora nessuna app di organizzazione nelle tue Panoramiche app.'},sv:{title:'Organisationsöversikt',orgs:'Organisationer',apps:'Appar',installs:'Installationer',growth:'Tillväxt',devices:'Enheter',suggestions:'förslag',review:'under granskning',rating:'betyg',empty:'Inga organisationsappar i dina Appöversikter än.'},no:{title:'Organisasjonsoversikt',orgs:'Organisasjoner',apps:'Apper',installs:'Installasjoner',growth:'Vekst',devices:'Enheter',suggestions:'forslag',review:'under gjennomgang',rating:'vurdering',empty:'Ingen organisasjonsapper i App-oversiktene dine ennå.'},es:{title:'Resumen de organizaciones',orgs:'Organizaciones',apps:'Apps',installs:'Instalaciones',growth:'Crecimiento',devices:'Dispositivos',suggestions:'sugerencias',review:'en revisión',rating:'valoración',empty:'Todavía no hay apps de organizaciones en tus Resúmenes de apps.'},da:{title:'Organisationsoversigt',orgs:'Organisationer',apps:'Apps',installs:'Installationer',growth:'Vækst',devices:'Enheder',suggestions:'forslag',review:'under gennemgang',rating:'bedømmelse',empty:'Ingen organisationsapps i dine App-oversigter endnu.'},pl:{title:'Przegląd organizacji',orgs:'Organizacje',apps:'Aplikacje',installs:'Instalacje',growth:'Wzrost',devices:'Urządzenia',suggestions:'sugestii',review:'w recenzji',rating:'ocena',empty:'Brak jeszcze aplikacji organizacji w Twoich Przeglądach aplikacji.'}};
function lang(v){return (l=>words[l]?l:'en')(String(v||'en').split('-')[0])}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function cfmt(n,l){const v=Number(n)||0;if(Math.abs(v)<10000)return fmt(v,l,0);try{return new Intl.NumberFormat((LOCALES[l]||'en-GB'),{notation:'compact',maximumFractionDigits:1}).format(v)}catch(e){return fmt(v,l,0)}}
function fmt(n,l,d=0){try{return new Intl.NumberFormat((LOCALES[l]||'en-GB'),{maximumFractionDigits:d}).format(Number(n)||0)}catch(_){return String(Number(n)||0)}}function sign(n,l,d=0){if(n===null||n===undefined)return'—';n=Number(n)||0;return(n>0?'+':'')+fmt(n,l,d)}function cls(n){return n===null||n===undefined?'unknown':Number(n)>0?'positive':Number(n)<0?'negative':''}
function onHomeyReady(Homey){const content=document.getElementById('content'),title=document.getElementById('title');let timer,busy=false,hasData=false;const settings=()=>Homey.getSettings()||{};function schedule(ms=60000){clearTimeout(timer);if(document.hidden)return;timer=setTimeout(run,ms)}async function run(){if(busy)return schedule(5000);busy=true;try{const s=settings(),data=await Homey.api('GET','/?range='+encodeURIComponent(s.range||'7d')+'&sort='+encodeURIComponent(s.sort||'installs'),{});draw(data);hasData=true}catch(e){if(!hasData)content.innerHTML='<div class="state error">'+esc(e.message||e)+'</div>'}finally{busy=false;schedule()}}
function draw(data){const l=lang(data.locale),w=words[l],rows=Array.isArray(data.organizations)?data.organizations:[];title.textContent=w.title;if(!rows.length){content.innerHTML='<div class="state">'+esc(w.empty)+'</div>';return}let html='<div class="stats"><div class="stat"><span>'+esc(w.orgs)+'</span><strong>'+fmt(data.organizationCount,l)+'</strong></div><div class="stat"><span>'+esc(w.apps)+'</span><strong>'+fmt(data.appCount,l)+'</strong></div><div class="stat"><span>'+esc(w.installs)+'</span><strong>'+cfmt(data.totalInstalls,l)+'</strong></div><div class="stat"><span>'+esc(w.growth)+'</span><strong class="'+cls(data.growth)+'">'+esc(sign(data.growth,l))+'</strong></div></div><div class="list">';rows.forEach((item,i)=>{const sub=[fmt(item.appCount,l)+' '+(l==='de'?w.apps:w.apps.toLowerCase()),fmt(item.totalDevices,l)+' '+(l==='de'?w.devices:w.devices.toLowerCase())];if(item.totalSuggestions)sub.push(fmt(item.totalSuggestions,l)+' '+w.suggestions);if(item.inReviewCount)sub.push(fmt(item.inReviewCount,l)+' '+w.review);if(item.averageRating>0)sub.push('★ '+fmt(item.averageRating,l,2));if(item.role)sub.push(item.role);const pct=item.growthPercent===null?'':(' · '+sign(item.growthPercent,l,1)+'%');html+='<article class="row"><div class="badge">'+(i+1)+'</div><div class="meta"><div class="name">'+esc(item.name)+(item.verified?' ✓':'')+'</div><div class="sub">'+esc(sub.join(' · '))+'</div></div><div class="numbers"><strong>'+fmt(item.totalInstalls,l)+'</strong><span class="'+cls(item.growth)+'">'+esc(sign(item.growth,l))+esc(pct)+'</span></div></article>'});html+='</div>';content.innerHTML=html}
document.addEventListener('visibilitychange',()=>{clearTimeout(timer);if(!document.hidden)run()});run().finally(()=>Homey.ready())}
</script></body></html>
