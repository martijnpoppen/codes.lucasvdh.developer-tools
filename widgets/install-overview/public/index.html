<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:var(--homey-background-color,#ffffff);color-scheme:light dark;--card:var(--homey-background-color,#f4f4f5);--header:var(--homey-background-color,#fafafa);--border:color-mix(in srgb,var(--bg) 88%,#000);--row:#fff;--primary:#232323;--secondary:#747378;--muted:#97969b;--title:#27435c;--soft:color-mix(in srgb,var(--bg) 92%,#000);--cloud:#1f6fe5;--local:#10a37f;--positive:#18794e;--negative:#b32632}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent;color:var(--primary);font:14px/1.28 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{display:grid;grid-template-rows:52px minmax(0,1fr);height:100%;border-radius:17px;overflow:hidden;background:var(--card)}header{display:flex;align-items:center;padding:0 18px;border-bottom:1px solid var(--border);background:var(--header)}.app{width:36px;height:36px;object-fit:contain}h1{margin:0 0 0 auto;color:var(--title);font-size:18px;font-weight:600;white-space:nowrap}#content{min-height:0;overflow-y:auto;padding:10px 12px 12px;scrollbar-width:none}#content::-webkit-scrollbar{display:none}.summary{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;margin-bottom:8px;border-radius:12px;background:var(--row);border:1px solid var(--border)}.label{color:var(--secondary);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}.total{margin-top:1px;font-size:28px;line-height:1;font-weight:850;letter-spacing:-.04em}.growth{margin-top:4px;font-size:11px;font-weight:750}.positive{color:var(--positive)}.negative{color:var(--negative)}.account{text-align:right;min-width:0}.account strong{display:block;max-width:170px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.account span{display:block;margin-top:2px;color:var(--muted);font-size:10px}.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:8px}.q{padding:7px 8px;border:1px solid var(--border);border-radius:10px;background:var(--row);min-width:0}.q b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.q span{display:block;color:var(--secondary);font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.list{display:grid;gap:6px}.row{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:9px;align-items:center;padding:7px 9px;border:1px solid var(--border);border-radius:11px;background:var(--row);cursor:pointer;transition:transform .12s ease,background .12s ease}.row:active{transform:scale(.992)}.appthumb{display:block;width:38px;height:38px;border-radius:10px;object-fit:contain;background:var(--soft);padding:3px}.meta{min-width:0}.name{font-weight:780;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{margin-top:2px;color:var(--secondary);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.distribution{display:flex;height:3px;margin-top:5px;border-radius:999px;overflow:hidden;background:var(--soft)}.distribution i{display:block;height:100%}.distribution .cloud{background:var(--cloud)}.distribution .local{background:var(--local)}.numbers{text-align:right}.numbers strong{display:block;font-size:15px;line-height:1.1}.numbers span{display:block;margin-top:3px;font-size:10px;color:var(--muted);white-space:nowrap}.state{display:grid;place-items:center;height:100%;padding:20px;text-align:center;color:var(--title)}.error{color:#b32632}.modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:12px;background:rgba(0,0,0,.38);backdrop-filter:blur(3px)}.modal.open{display:flex}.sheet{width:min(100%,390px);max-height:calc(100% - 10px);overflow:auto;border:1px solid var(--border);border-radius:16px;background:var(--row);box-shadow:0 14px 40px rgba(0,0,0,.24)}.sheethead{display:grid;grid-template-columns:48px minmax(0,1fr) 32px;gap:10px;align-items:center;padding:13px;border-bottom:1px solid var(--border)}.sheeticon{width:48px;height:48px;border-radius:12px;object-fit:contain;background:var(--soft);padding:4px}.sheetname{font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sheetid{margin-top:2px;color:var(--muted);font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.close{display:grid;place-items:center;width:32px;height:32px;border:0;border-radius:16px;background:var(--soft);color:var(--primary);font-size:20px;line-height:1;cursor:pointer}.sheetbody{padding:12px}.detailgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.detail{padding:8px 9px;border:1px solid var(--border);border-radius:10px;background:var(--card);min-width:0}.detail b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.detail span{display:block;margin-top:2px;color:var(--secondary);font-size:9px}.versionbox{margin-top:8px;padding:9px 10px;border:1px solid var(--border);border-radius:10px;background:var(--card)}.versionline{display:flex;justify-content:space-between;gap:10px;font-size:11px}.versionline+.versionline{margin-top:5px}.versionline span:first-child{color:var(--secondary)}.skeleton{display:grid;gap:7px}.sk{height:55px;border-radius:11px;background:linear-gradient(90deg,var(--soft),var(--row),var(--soft));background-size:220% 100%;animation:pulse 1.25s linear infinite}@keyframes pulse{to{background-position:-220% 0}}
@media(prefers-color-scheme:dark){:root{--bg:#121b2b;--card:#121b2b;--header:#172338;--border:color-mix(in srgb,var(--bg) 84%,#fff);--row:color-mix(in srgb,var(--bg) 92%,#fff);--primary:#f4f4f5;--secondary:#b4c2d3;--muted:#8fa0b6;--title:#a9bdd3;--soft:color-mix(in srgb,var(--bg) 86%,#fff);--cloud:#4c95ff;--local:#2fd29a;--positive:#6ed7a7;--negative:#ff8a92}}

</style></head><body>
<main class="card"><header><img class="app" src="icon.svg" alt=""><h1 id="title">App-installaties</h1></header><section id="content"><div class="skeleton"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div></section></main><div id="modal" class="modal" aria-hidden="true"><section class="sheet" role="dialog" aria-modal="true"><div class="sheethead"><img id="sheetIcon" class="sheeticon" src="icon.svg" alt=""><div><div id="sheetName" class="sheetname"></div><div id="sheetId" class="sheetid"></div></div><button id="closeModal" class="close" type="button" aria-label="Close">×</button></div><div id="sheetBody" class="sheetbody"></div></section></div>
<script>
const LOCALES={en:'en-GB',nl:'nl-NL',de:'de-DE',fr:'fr-FR',it:'it-IT',sv:'sv-SE',no:'nb-NO',es:'es-ES',da:'da-DK',pl:'pl-PL'};const words={nl:{title:'App-installaties',empty:'Geen apps gevonden.',total:'Totaal installaties',apps:'Apps',cloud:'Cloud',local:'Lokaal',devices:'Apparaten',updated:'Bijgewerkt',growth:'7d groei',review:'In review',suggestions:'Suggesties',live:'Live',details:'App-details',rating:'Beoordeling',test:'Test',status:'Status',builds:'Builds',age:'Live build leeftijd',days:'dagen',none:'Geen'},en:{title:'App Installs',empty:'No apps found.',total:'Total installs',apps:'Apps',cloud:'Cloud',local:'Local',devices:'Devices',updated:'Updated',growth:'7d growth',review:'In review',suggestions:'Suggestions',live:'Live',details:'App details',rating:'Rating',test:'Test',status:'Status',builds:'Builds',age:'Live build age',days:'days',none:'None'},de:{title:'App-Installationen',empty:'Keine Apps gefunden.',total:'Gesamtinstallationen',apps:'Apps',cloud:'Cloud',local:'Lokal',devices:'Geräte',updated:'Aktualisiert',growth:'Wachstum 7 T.',review:'In Prüfung',suggestions:'Vorschläge',live:'Live',details:'App-Details',rating:'Bewertung',test:'Test',status:'Status',builds:'Builds',age:'Alter des Live-Builds',days:'Tage',none:'Keine'},fr:{title:'Installations des apps',empty:'Aucune app trouvée.',total:'Installations totales',apps:'Apps',cloud:'Cloud',local:'Local',devices:'Appareils',updated:'Mis à jour',growth:'Croissance 7 j',review:'En revue',suggestions:'Suggestions',live:'Live',details:'Détails de l\'app',rating:'Note',test:'Test',status:'Statut',builds:'Builds',age:'Âge du build live',days:'jours',none:'Aucun'},it:{title:'Installazioni app',empty:'Nessuna app trovata.',total:'Installazioni totali',apps:'App',cloud:'Cloud',local:'Locale',devices:'Dispositivi',updated:'Aggiornato',growth:'Crescita 7 g',review:'In revisione',suggestions:'Suggerimenti',live:'Live',details:'Dettagli dell\'app',rating:'Valutazione',test:'Test',status:'Stato',builds:'Build',age:'Età della build live',days:'giorni',none:'Nessuno'},sv:{title:'Appinstallationer',empty:'Inga appar hittades.',total:'Totalt antal installationer',apps:'Appar',cloud:'Moln',local:'Lokalt',devices:'Enheter',updated:'Uppdaterad',growth:'Tillväxt 7 d',review:'Under granskning',suggestions:'Förslag',live:'Live',details:'Appdetaljer',rating:'Betyg',test:'Test',status:'Status',builds:'Byggen',age:'Ålder på livebygge',days:'dagar',none:'Ingen'},no:{title:'App-installasjoner',empty:'Ingen apper funnet.',total:'Totalt antall installasjoner',apps:'Apper',cloud:'Sky',local:'Lokalt',devices:'Enheter',updated:'Oppdatert',growth:'Vekst 7 d',review:'Under gjennomgang',suggestions:'Forslag',live:'Live',details:'Appdetaljer',rating:'Vurdering',test:'Test',status:'Status',builds:'Bygg',age:'Alder på livebygg',days:'dager',none:'Ingen'},es:{title:'Instalaciones de apps',empty:'No se encontraron apps.',total:'Instalaciones totales',apps:'Apps',cloud:'Nube',local:'Local',devices:'Dispositivos',updated:'Actualizado',growth:'Crecimiento 7 d',review:'En revisión',suggestions:'Sugerencias',live:'Live',details:'Detalles de la app',rating:'Valoración',test:'Prueba',status:'Estado',builds:'Builds',age:'Antigüedad del build live',days:'días',none:'Ninguno'},da:{title:'App-installationer',empty:'Ingen apps fundet.',total:'Samlede installationer',apps:'Apps',cloud:'Cloud',local:'Lokalt',devices:'Enheder',updated:'Opdateret',growth:'Vækst 7 d',review:'Under gennemgang',suggestions:'Forslag',live:'Live',details:'Appdetaljer',rating:'Bedømmelse',test:'Test',status:'Status',builds:'Builds',age:'Alder på live-build',days:'dage',none:'Ingen'},pl:{title:'Instalacje aplikacji',empty:'Nie znaleziono aplikacji.',total:'Łączna liczba instalacji',apps:'Aplikacje',cloud:'Chmura',local:'Lokalnie',devices:'Urządzenia',updated:'Zaktualizowano',growth:'Wzrost 7 d',review:'W recenzji',suggestions:'Sugestie',live:'Live',details:'Szczegóły aplikacji',rating:'Ocena',test:'Test',status:'Status',builds:'Buildy',age:'Wiek buildu live',days:'dni',none:'Brak'}};
function lang(v){return (l=>words[l]?l:'en')(String(v||'en').split('-')[0])}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function cfmt(n,l){const v=Number(n)||0;if(Math.abs(v)<10000)return fmt(v,l,0);try{return new Intl.NumberFormat((LOCALES[l]||'en-GB'),{notation:'compact',maximumFractionDigits:1}).format(v)}catch(e){return fmt(v,l,0)}}
function fmt(n,l,d=0){try{return new Intl.NumberFormat((LOCALES[l]||'en-GB'),{maximumFractionDigits:d}).format(Number(n)||0)}catch(_){return String(Number(n)||0)}}function signed(n,l){if(n===null||n===undefined)return'—';n=Number(n)||0;return(n>0?'+':'')+fmt(n,l)}function cls(n){return n===null||n===undefined?'':Number(n)>0?'positive':Number(n)<0?'negative':''}function time(ts,l,tz){try{return new Intl.DateTimeFormat((LOCALES[l]||'en-GB'),{timeZone:tz,hour:'2-digit',minute:'2-digit'}).format(new Date(Number(ts)||Date.now()))}catch(_){return''}}function img(u){return'<img class="appthumb" src="'+esc(u||'icon.svg')+'" alt="" onerror="this.onerror=null;this.src=\'icon.svg\'">'}
function onHomeyReady(Homey){const content=document.getElementById('content'),title=document.getElementById('title'),modal=document.getElementById('modal'),sheetIcon=document.getElementById('sheetIcon'),sheetName=document.getElementById('sheetName'),sheetId=document.getElementById('sheetId'),sheetBody=document.getElementById('sheetBody');let timer=null,busy=false,hasData=false,currentData=null,currentApps=[];const settings=()=>Homey.getSettings()||{};const deviceId=()=>((Homey.getDeviceIds()||[])[0]||'');
function schedule(ms=60000){clearTimeout(timer);if(document.hidden)return;timer=setTimeout(run,ms)}
function closePopup(){modal.classList.remove('open');modal.setAttribute('aria-hidden','true')}
function openPopup(index){const a=currentApps[index],data=currentData;if(!a||!data)return;const l=lang(data.locale),w=words[l];sheetIcon.src=a.iconUrl||'icon.svg';sheetIcon.onerror=()=>{sheetIcon.onerror=null;sheetIcon.src='icon.svg'};sheetName.textContent=a.name||a.id;sheetId.textContent=a.id||'';const rating=a.hasRating?fmt(a.rating,l,2):'—',review=a.testState||w.none,test=a.testVersion?'v'+a.testVersion:'—',live=a.liveVersion?'v'+a.liveVersion:'—',age=Number(a.liveBuildAgeDays)?fmt(a.liveBuildAgeDays,l)+' '+w.days:'—';sheetBody.innerHTML='<div class="label">'+esc(w.details)+'</div><div class="detailgrid" style="margin-top:7px"><div class="detail"><b>'+fmt(a.installs,l)+'</b><span>'+esc(w.total)+'</span></div><div class="detail"><b class="'+cls(a.growth7d)+'">'+esc(signed(a.growth7d,l))+'</b><span>'+esc(w.growth)+'</span></div><div class="detail"><b>'+fmt(a.cloud,l)+'</b><span>'+esc(w.cloud)+'</span></div><div class="detail"><b>'+fmt(a.local,l)+'</b><span>'+esc(w.local)+'</span></div><div class="detail"><b>'+fmt(a.deviceCount,l)+'</b><span>'+esc(w.devices)+'</span></div><div class="detail"><b>'+esc(rating)+'</b><span>'+esc(w.rating)+'</span></div><div class="detail"><b>'+fmt(a.suggestionsCount,l)+'</b><span>'+esc(w.suggestions)+'</span></div><div class="detail"><b>'+fmt(a.buildCount,l)+'</b><span>'+esc(w.builds)+'</span></div></div><div class="versionbox"><div class="versionline"><span>'+esc(w.live)+'</span><strong>'+esc(live)+'</strong></div><div class="versionline"><span>'+esc(w.test)+'</span><strong>'+esc(test)+'</strong></div><div class="versionline"><span>'+esc(w.status)+'</span><strong>'+esc(review)+'</strong></div><div class="versionline"><span>'+esc(w.age)+'</span><strong>'+esc(age)+'</strong></div></div>';modal.classList.add('open');modal.setAttribute('aria-hidden','false')}
document.getElementById('closeModal').addEventListener('click',closePopup);modal.addEventListener('click',e=>{if(e.target===modal)closePopup()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closePopup()});
async function run(){if(busy){schedule(5000);return}busy=true;try{const s=settings();const url='/?deviceId='+encodeURIComponent(deviceId())+'&sort='+encodeURIComponent(s.sort||'installs')+'&limit='+encodeURIComponent(s.limit||'8');const data=await Homey.api('GET',url,{});draw(data);hasData=true}catch(e){if(!hasData)content.innerHTML='<div class="state error">'+esc(e.message||e)+'</div>'}finally{busy=false;schedule()}}
function draw(data){const l=lang(data.locale),w=words[l],apps=Array.isArray(data.apps)?data.apps:[];currentData=data;currentApps=apps;title.textContent=w.title;if(!apps.length){content.innerHTML='<div class="state">'+esc(w.empty)+'</div>';return}const account=data.accountType==='organization'?(data.organization||data.name):(data.name||'');let html='<section class="summary"><div><div class="label">'+esc(w.total)+'</div><div class="total">'+fmt(data.totalInstalls,l)+'</div><div class="growth '+cls(data.growth7d)+'">'+esc(w.growth)+' '+esc(signed(data.growth7d,l))+'</div></div><div class="account"><strong>'+esc(account)+'</strong><span>'+fmt(data.appCount,l)+' '+esc(w.apps)+' · '+esc(w.updated)+' '+esc(time(data.updatedAt,l,data.timeZone))+'</span></div></section><div class="quick"><div class="q"><b>'+cfmt(data.totalCloud,l)+'</b><span>'+esc(w.cloud)+'</span></div><div class="q"><b>'+cfmt(data.totalLocal,l)+'</b><span>'+esc(w.local)+'</span></div><div class="q"><b>'+cfmt(data.totalDevices,l)+'</b><span>'+esc(w.devices)+'</span></div><div class="q"><b>'+fmt(data.appCount,l)+'</b><span>'+esc(w.apps)+'</span></div></div><div class="list">';
for(const [index,a] of apps.entries()){const splitTotal=(Number(a.cloud)||0)+(Number(a.local)||0),cp=splitTotal>0?Math.max(0,Math.min(100,(Number(a.cloud)||0)/splitTotal*100)):0,lp=splitTotal>0?Math.max(0,100-cp):0;const sub=[];if(a.liveVersion)sub.push(w.live+' v'+a.liveVersion);if(Number(a.deviceCount))sub.push(fmt(a.deviceCount,l)+' '+(l==='de'?w.devices:w.devices.toLowerCase()));if(a.testState==='in_review')sub.push(w.review);if(Number(a.suggestionsCount))sub.push(fmt(a.suggestionsCount,l)+' '+w.suggestions);html+='<article class="row" data-app-index="'+index+'" tabindex="0">'+img(a.iconUrl)+'<div class="meta"><div class="name">'+esc(a.name||a.id)+'</div><div class="sub">'+esc(sub.join(' · ')||a.id)+'</div><div class="distribution" aria-hidden="true"><i class="cloud" style="width:'+cp.toFixed(1)+'%"></i><i class="local" style="width:'+lp.toFixed(1)+'%"></i></div></div><div class="numbers"><strong>'+fmt(a.installs,l)+'</strong><span class="'+cls(a.growth7d)+'">'+esc(signed(a.growth7d,l))+' / 7d</span></div></article>'}html+='</div>';content.innerHTML=html;content.querySelectorAll('[data-app-index]').forEach(el=>{const open=()=>openPopup(Number(el.dataset.appIndex));el.addEventListener('click',open);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}})})}
document.addEventListener('visibilitychange',()=>{clearTimeout(timer);if(!document.hidden)run()});run().finally(()=>Homey.ready())}
</script></body></html>
