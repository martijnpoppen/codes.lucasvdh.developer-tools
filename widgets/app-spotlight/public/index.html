<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:var(--homey-background-color,#ffffff);color-scheme:light dark;--card:var(--homey-background-color,#f4f4f5);--header:var(--homey-background-color,#fafafa);--border:color-mix(in srgb,var(--bg) 88%,#000);--panel:#fff;--primary:#232323;--secondary:#747378;--muted:#97969b;--title:#27435c;--line:#1f6fe5;--grid:color-mix(in srgb,var(--bg) 90%,#000);--positive:#18794e;--negative:#b32632;--soft:color-mix(in srgb,var(--bg) 92%,#000);--brand:#222326}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent;color:var(--primary);font:14px/1.28 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{display:grid;grid-template-rows:52px minmax(0,1fr);height:100%;border-radius:17px;overflow:hidden;background:var(--card)}header{display:flex;align-items:center;padding:0 18px;border-bottom:1px solid var(--border);background:var(--header)}.appicon{width:36px;height:36px;object-fit:contain;border-radius:9px}h1{margin:0 0 0 auto;color:var(--title);font-size:18px;font-weight:600;white-space:nowrap}#content{display:grid;grid-template-rows:auto auto auto minmax(0,1fr);gap:7px;min-height:0;padding:9px 12px 12px}.hero{position:relative;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:9px 10px;border:1px solid var(--border);border-radius:12px;background:var(--panel);overflow:hidden}.hero:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--brand)}.appname{min-width:0;padding-left:4px}.appname strong{display:block;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.appname span{display:block;margin-top:2px;color:var(--secondary);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.installs{text-align:right;font-size:27px;font-weight:850;line-height:1}.installs span{display:block;margin-top:3px;color:var(--secondary);font-size:10px;font-weight:600}.stats,.details{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.stat,.detail{min-width:0;padding:7px 8px;border:1px solid var(--border);border-radius:10px;background:var(--panel)}.stat span,.detail span{display:block;color:var(--secondary);font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stat strong{display:block;margin-top:2px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.detail strong{display:block;margin-top:2px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.positive{color:var(--positive)}.negative{color:var(--negative)}.chart{position:relative;min-height:0;padding:8px;border:1px solid var(--border);border-radius:12px;background:var(--panel)}.charthead{position:absolute;top:6px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:9px;z-index:1}.growths{display:flex;gap:8px}.growths b{font-weight:750}svg{display:block;width:100%;height:100%;min-height:116px}.grid{stroke:var(--grid);stroke-width:1}.actual{fill:none;stroke:var(--brand);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.area{fill:var(--brand);opacity:.07}.dot{fill:var(--brand)}.hint{position:absolute;inset:28px 0 0;display:grid;place-items:center;color:var(--muted);font-size:10px;pointer-events:none}.state{display:grid;place-items:center;height:100%;padding:20px;text-align:center;color:var(--title);grid-row:1/-1}.error{color:#b32632}
@media(prefers-color-scheme:dark){:root{--bg:#121b2b;--card:#121b2b;--header:#172338;--border:color-mix(in srgb,var(--bg) 84%,#fff);--panel:color-mix(in srgb,var(--bg) 92%,#fff);--primary:#f4f4f5;--secondary:#b4c2d3;--muted:#8fa0b6;--title:#a9bdd3;--line:#4c95ff;--grid:color-mix(in srgb,var(--bg) 84%,#fff);--positive:#6ed7a7;--negative:#ff8a92;--soft:color-mix(in srgb,var(--bg) 86%,#fff)}}

</style></head><body>
<main class="card"><header><img class="appicon" id="headerIcon" src="icon.svg" alt=""><h1 id="title">App Spotlight</h1></header><section id="content"><div class="state">…</div></section></main>
<script>
const LOCALES={en:'en-GB',nl:'nl-NL',de:'de-DE',fr:'fr-FR',it:'it-IT',sv:'sv-SE',no:'nb-NO',es:'es-ES',da:'da-DK',pl:'pl-PL'};const words={nl:{title:'App Spotlight',installs:'installaties',cloud:'Cloud',local:'Lokaal',rating:'Rating',devices:'Apparaten',live:'Live',test:'Test',suggestions:'Suggesties',builds:'Builds',age:'dagen oud',athom:'Athom-historie',localhist:'Lokale fallback',building:'Nog niet genoeg historie.',g24:'24u',g7:'7d',g30:'30d',review:'In review'},en:{title:'App Spotlight',installs:'installs',cloud:'Cloud',local:'Local',rating:'Rating',devices:'Devices',live:'Live',test:'Test',suggestions:'Suggestions',builds:'Builds',age:'days old',athom:'Athom history',localhist:'Local fallback',building:'Not enough history yet.',g24:'24h',g7:'7d',g30:'30d',review:'In review'},de:{title:'App im Fokus',installs:'Installationen',cloud:'Cloud',local:'Lokal',rating:'Bewertung',devices:'Geräte',live:'Live',test:'Test',suggestions:'Vorschläge',builds:'Builds',age:'Tage alt',athom:'Athom-Verlauf',localhist:'Lokaler Verlauf',building:'Noch nicht genug Verlauf.',g24:'24 Std.',g7:'7 T.',g30:'30 T.',review:'In Prüfung'},fr:{title:'App en vedette',installs:'installations',cloud:'Cloud',local:'Local',rating:'Note',devices:'Appareils',live:'Live',test:'Test',suggestions:'Suggestions',builds:'Builds',age:'jours',athom:'Historique Athom',localhist:'Historique local',building:'Pas encore assez d\'historique.',g24:'24 h',g7:'7 j',g30:'30 j',review:'En revue'},it:{title:'App in evidenza',installs:'installazioni',cloud:'Cloud',local:'Locale',rating:'Valutazione',devices:'Dispositivi',live:'Live',test:'Test',suggestions:'Suggerimenti',builds:'Build',age:'giorni',athom:'Cronologia Athom',localhist:'Cronologia locale',building:'Cronologia non ancora sufficiente.',g24:'24 h',g7:'7 g',g30:'30 g',review:'In revisione'},sv:{title:'App i fokus',installs:'installationer',cloud:'Moln',local:'Lokalt',rating:'Betyg',devices:'Enheter',live:'Live',test:'Test',suggestions:'Förslag',builds:'Byggen',age:'dagar gammal',athom:'Athom-historik',localhist:'Lokal historik',building:'Inte tillräckligt med historik än.',g24:'24 h',g7:'7 d',g30:'30 d',review:'Under granskning'},no:{title:'App i fokus',installs:'installasjoner',cloud:'Sky',local:'Lokalt',rating:'Vurdering',devices:'Enheter',live:'Live',test:'Test',suggestions:'Forslag',builds:'Bygg',age:'dager gammel',athom:'Athom-historikk',localhist:'Lokal historikk',building:'Ikke nok historikk ennå.',g24:'24 t',g7:'7 d',g30:'30 d',review:'Under gjennomgang'},es:{title:'App destacada',installs:'instalaciones',cloud:'Nube',local:'Local',rating:'Valoración',devices:'Dispositivos',live:'Live',test:'Prueba',suggestions:'Sugerencias',builds:'Builds',age:'días',athom:'Historial de Athom',localhist:'Historial local',building:'Todavía no hay suficiente historial.',g24:'24 h',g7:'7 d',g30:'30 d',review:'En revisión'},da:{title:'App i fokus',installs:'installationer',cloud:'Cloud',local:'Lokalt',rating:'Bedømmelse',devices:'Enheder',live:'Live',test:'Test',suggestions:'Forslag',builds:'Builds',age:'dage gammel',athom:'Athom-historik',localhist:'Lokal historik',building:'Endnu ikke nok historik.',g24:'24 t',g7:'7 d',g30:'30 d',review:'Under gennemgang'},pl:{title:'Aplikacja w centrum',installs:'instalacji',cloud:'Chmura',local:'Lokalnie',rating:'Ocena',devices:'Urządzenia',live:'Live',test:'Test',suggestions:'Sugestie',builds:'Buildy',age:'dni',athom:'Historia Athom',localhist:'Historia lokalna',building:'Za mało historii.',g24:'24 h',g7:'7 d',g30:'30 d',review:'W recenzji'}};
function lang(v){return (l=>words[l]?l:'en')(String(v||'en').split('-')[0])}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function fmt(n,l,d=0){try{return new Intl.NumberFormat((LOCALES[l]||'en-GB'),{maximumFractionDigits:d}).format(Number(n)||0)}catch(_){return String(Number(n)||0)}}function growth(n,l){if(n===null||n===undefined)return'—';n=Number(n)||0;return(n>0?'+':'')+fmt(n,l)}function cls(n){return n===null||n===undefined?'':Number(n)>0?'positive':Number(n)<0?'negative':''}function validColor(v){return /^#[0-9a-f]{3,8}$/i.test(String(v||''))?String(v):''}
function onHomeyReady(Homey){const content=document.getElementById('content'),title=document.getElementById('title'),icon=document.getElementById('headerIcon');let timer,busy=false,hasData=false;const settings=()=>Homey.getSettings()||{};function schedule(ms=60000){clearTimeout(timer);if(document.hidden)return;timer=setTimeout(run,ms)}async function run(){if(busy)return schedule(5000);busy=true;try{const s=settings(),dev=s.device||{},app=s.app||{},did=typeof dev==='string'?dev:(dev.id||''),linked=typeof app==='object'&&app.deviceId?String(app.deviceId):'',aid=linked&&linked!==String(did)?'':(typeof app==='string'?app:(app.id||''));const data=await Homey.api('GET','/?deviceId='+encodeURIComponent(did)+'&appId='+encodeURIComponent(aid),{});draw(data);hasData=true}catch(e){content.innerHTML='<div class="state error">'+esc(e.message||e)+'</div>'}finally{busy=false;schedule()}}
function draw(data){const l=lang(data.locale),w=words[l],a=data.app;title.textContent=w.title;icon.onerror=()=>{icon.onerror=null;icon.src='icon.svg'};icon.src=a.iconUrl||'icon.svg';const brand=validColor(a.brandColor);document.documentElement.style.setProperty('--brand',brand||'var(--line)');const review=a.testState==='in_review'?' · '+w.review:'';content.innerHTML='<div class="hero"><div class="appname"><strong>'+esc(a.name||a.id)+'</strong><span>'+esc(a.owner||data.deviceName||'')+' · '+esc(a.id)+esc(review)+'</span></div><div class="installs">'+fmt(a.installs,l)+'<span>'+esc(w.installs)+' · <b class="'+cls(data.growth7d)+'">'+esc(growth(data.growth7d,l))+' / 7d</b></span></div></div><div class="stats"><div class="stat"><span>'+esc(w.cloud)+'</span><strong>'+fmt(a.cloud,l)+'</strong></div><div class="stat"><span>'+esc(w.local)+'</span><strong>'+fmt(a.local,l)+'</strong></div><div class="stat"><span>'+esc(w.rating)+'</span><strong>'+(a.hasRating===false||Number(a.rating)<=0?'—':fmt(a.rating,l,2))+'</strong></div><div class="stat"><span>'+esc(w.devices)+'</span><strong>'+fmt(a.deviceCount,l)+'</strong></div></div><div class="details"><div class="detail"><span>'+esc(w.live)+'</span><strong>'+(a.liveVersion?'v'+esc(a.liveVersion):'—')+(a.liveBuildAgeDays?' · '+fmt(a.liveBuildAgeDays,l)+' '+esc(w.age):'')+'</strong></div><div class="detail"><span>'+esc(w.test)+'</span><strong>'+(a.testVersion?'v'+esc(a.testVersion):'—')+(a.testState?' · '+esc(a.testState):'')+'</strong></div><div class="detail"><span>'+esc(w.suggestions)+'</span><strong>'+fmt(a.suggestionsCount,l)+'</strong></div><div class="detail"><span>'+esc(w.builds)+'</span><strong>'+fmt(a.buildCount,l)+'</strong></div></div><div class="chart"><div class="charthead"><span>'+esc(data.historySource==='athom'?w.athom:w.localhist)+'</span><span class="growths"><b class="'+cls(data.growth24h)+'">'+esc(w.g24)+' '+esc(growth(data.growth24h,l))+'</b><b class="'+cls(data.growth7d)+'">'+esc(w.g7)+' '+esc(growth(data.growth7d,l))+'</b><b class="'+cls(data.growth30d)+'">'+esc(w.g30)+' '+esc(growth(data.growth30d,l))+'</b></span></div><svg id="spark" viewBox="0 0 640 130" preserveAspectRatio="none"></svg>'+((data.history||[]).length<2?'<div class="hint">'+esc(w.building)+'</div>':'')+'</div>';drawChart(data.history||[])}
function drawChart(history){const svg=document.getElementById('spark');if(!svg)return;let pts=history.map(p=>({t:Number(p.t),v:Number(p.v)})).filter(p=>Number.isFinite(p.t)&&Number.isFinite(p.v)).sort((a,b)=>a.t-b.t);if(pts.length<2){svg.innerHTML='';return}if(pts.length>240){const step=(pts.length-1)/239;pts=Array.from({length:240},(_,i)=>pts[Math.round(i*step)])}const W=640,H=130,L=8,R=8,T=24,B=7,minT=pts[0].t,maxT=pts[pts.length-1].t===pts[0].t?pts[0].t+1:pts[pts.length-1].t;let minV=Math.min(...pts.map(p=>p.v)),maxV=Math.max(...pts.map(p=>p.v));if(minV===maxV){minV-=1;maxV+=1}const pad=Math.max(1,(maxV-minV)*.12);minV-=pad;maxV+=pad;const x=t=>L+(t-minT)/(maxT-minT)*(W-L-R),y=v=>T+(maxV-v)/(maxV-minV)*(H-T-B);let grid='';for(let i=0;i<3;i++){const yy=T+i*((H-T-B)/2);grid+='<line class="grid" x1="'+L+'" y1="'+yy+'" x2="'+(W-R)+'" y2="'+yy+'"/>'}const path=pts.map((p,i)=>(i?'L':'M')+x(p.t).toFixed(1)+' '+y(p.v).toFixed(1)).join(' '),area=path+' L'+x(pts[pts.length-1].t).toFixed(1)+' '+(H-B)+' L'+x(pts[0].t).toFixed(1)+' '+(H-B)+' Z',last=pts[pts.length-1];svg.innerHTML=grid+'<path class="area" d="'+area+'"/><path class="actual" d="'+path+'"/><circle class="dot" cx="'+x(last.t)+'" cy="'+y(last.v)+'" r="3.5"/>'}
document.addEventListener('visibilitychange',()=>{clearTimeout(timer);if(!document.hidden)run()});run().finally(()=>Homey.ready())}
</script></body></html>
