<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:var(--homey-background-color,#ffffff);color-scheme:light dark;--card:var(--homey-background-color,#f4f4f5);--header:var(--homey-background-color,#fafafa);--border:color-mix(in srgb,var(--bg) 88%,#000);--panel:#fff;--primary:#232323;--secondary:#747378;--muted:#97969b;--title:#27435c;--line:#1f6fe5;--trend:#8aa0b6;--grid:color-mix(in srgb,var(--bg) 90%,#000);--positive:#18794e;--negative:#b32632}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent;color:var(--primary);font:14px/1.28 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{display:grid;grid-template-rows:52px minmax(0,1fr);height:100%;border-radius:17px;overflow:hidden;background:var(--card)}header{display:flex;align-items:center;padding:0 18px;border-bottom:1px solid var(--border);background:var(--header)}.app{width:36px;height:36px;object-fit:contain}h1{margin:0 0 0 auto;color:var(--title);font-size:18px;font-weight:600;white-space:nowrap}#content{display:grid;grid-template-rows:auto minmax(0,1fr);gap:8px;min-height:0;padding:10px 12px 12px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.stat{padding:7px 8px;border:1px solid var(--border);border-radius:10px;background:var(--panel);min-width:0}.stat span{display:block;color:var(--secondary);font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stat strong{display:block;margin-top:2px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.positive{color:var(--positive)}.negative{color:var(--negative)}.chart{position:relative;min-height:0;padding:8px;border:1px solid var(--border);border-radius:12px;background:var(--panel)}.source{position:absolute;left:10px;top:6px;color:var(--muted);font-size:9px}.legend{position:absolute;right:10px;top:6px;display:flex;gap:10px;color:var(--secondary);font-size:9px}.legend .tl{color:var(--trend)}svg{display:block;width:100%;height:100%;min-height:215px}.grid{stroke:var(--grid);stroke-width:1}.actual{fill:none;stroke:var(--line);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.trend{fill:none;stroke:var(--trend);stroke-width:2;stroke-dasharray:7 6}.area{fill:var(--line);opacity:.05}.dot{fill:var(--line)}.axis{fill:var(--muted);font-size:9px}.hint{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:10px;pointer-events:none}.state{display:grid;place-items:center;height:100%;padding:20px;text-align:center;color:var(--title)}.error{color:#b32632}
@media(prefers-color-scheme:dark){:root{--bg:#121b2b;--card:#121b2b;--header:#172338;--border:color-mix(in srgb,var(--bg) 84%,#fff);--panel:color-mix(in srgb,var(--bg) 92%,#fff);--primary:#f4f4f5;--secondary:#b4c2d3;--muted:#8fa0b6;--title:#a9bdd3;--line:#4c95ff;--trend:#6f86a0;--grid:color-mix(in srgb,var(--bg) 84%,#fff);--positive:#6ed7a7;--negative:#ff8a92}}

</style></head><body>
<main class="card"><header><img class="app" src="icon.svg" alt=""><h1 id="title">Installatietrend</h1></header><section id="content"><div class="state">…</div></section></main>
<script>
const LOCALES={en:'en-GB',nl:'nl-NL',de:'de-DE',fr:'fr-FR',it:'it-IT',sv:'sv-SE',no:'nb-NO',es:'es-ES',da:'da-DK',pl:'pl-PL'};const words={nl:{title:'Installatietrend',current:'Nu',change:'Verschil',percent:'Groei %',perDay:'Trend / dag',actual:'Werkelijk',trend:'Trendlijn',building:'Nog niet genoeg historie.',sourceAthom:'Athom-historie',sourceLocal:'Lokale fallback'},en:{title:'Install Trend',current:'Now',change:'Change',percent:'Growth %',perDay:'Trend / day',actual:'Actual',trend:'Trendline',building:'Not enough history yet.',sourceAthom:'Athom history',sourceLocal:'Local fallback'},de:{title:'Installationstrend',current:'Jetzt',change:'Änderung',percent:'Wachstum %',perDay:'Trend / Tag',actual:'Tatsächlich',trend:'Trendlinie',building:'Noch nicht genug Verlauf.',sourceAthom:'Athom-Verlauf',sourceLocal:'Lokaler Verlauf'},fr:{title:'Tendance des installations',current:'Maintenant',change:'Variation',percent:'Croissance %',perDay:'Tendance / jour',actual:'Réel',trend:'Ligne de tendance',building:'Pas encore assez d\'historique.',sourceAthom:'Historique Athom',sourceLocal:'Historique local'},it:{title:'Andamento installazioni',current:'Ora',change:'Variazione',percent:'Crescita %',perDay:'Andamento / giorno',actual:'Effettivo',trend:'Linea di tendenza',building:'Cronologia non ancora sufficiente.',sourceAthom:'Cronologia Athom',sourceLocal:'Cronologia locale'},sv:{title:'Installationstrend',current:'Nu',change:'Förändring',percent:'Tillväxt %',perDay:'Trend / dag',actual:'Faktiskt',trend:'Trendlinje',building:'Inte tillräckligt med historik än.',sourceAthom:'Athom-historik',sourceLocal:'Lokal historik'},no:{title:'Installasjonstrend',current:'Nå',change:'Endring',percent:'Vekst %',perDay:'Trend / dag',actual:'Faktisk',trend:'Trendlinje',building:'Ikke nok historikk ennå.',sourceAthom:'Athom-historikk',sourceLocal:'Lokal historikk'},es:{title:'Tendencia de instalaciones',current:'Ahora',change:'Cambio',percent:'Crecimiento %',perDay:'Tendencia / día',actual:'Real',trend:'Línea de tendencia',building:'Todavía no hay suficiente historial.',sourceAthom:'Historial de Athom',sourceLocal:'Historial local'},da:{title:'Installationstrend',current:'Nu',change:'Ændring',percent:'Vækst %',perDay:'Trend / dag',actual:'Faktisk',trend:'Trendlinje',building:'Endnu ikke nok historik.',sourceAthom:'Athom-historik',sourceLocal:'Lokal historik'},pl:{title:'Trend instalacji',current:'Teraz',change:'Zmiana',percent:'Wzrost %',perDay:'Trend / dzień',actual:'Rzeczywiste',trend:'Linia trendu',building:'Za mało historii.',sourceAthom:'Historia Athom',sourceLocal:'Historia lokalna'}};
function lang(v){return (l=>words[l]?l:'en')(String(v||'en').split('-')[0])}function cfmt(n,l){const v=Number(n)||0;if(Math.abs(v)<10000)return fmt(v,l,0);try{return new Intl.NumberFormat((LOCALES[l]||'en-GB'),{notation:'compact',maximumFractionDigits:1}).format(v)}catch(e){return fmt(v,l,0)}}
function fmt(n,l,d=1){try{return new Intl.NumberFormat((LOCALES[l]||'en-GB'),{maximumFractionDigits:d}).format(Number(n)||0)}catch(_){return String(Number(n)||0)}}function sign(n,l,d=1){n=Number(n)||0;return(n>0?'+':'')+fmt(n,l,d)}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function cls(n){return Number(n)>0?'positive':Number(n)<0?'negative':''}function sample(points,max=260){if(points.length<=max)return points;const step=(points.length-1)/(max-1);return Array.from({length:max},(_,i)=>points[Math.round(i*step)])}function regression(points){if(points.length<2)return{a:0,b:points[0]?.v||0,x0:points[0]?.t||Date.now()};const x0=points[0].t;let sx=0,sy=0,sxx=0,sxy=0;for(const p of points){const x=(p.t-x0)/86400000,y=p.v;sx+=x;sy+=y;sxx+=x*x;sxy+=x*y}const n=points.length,den=n*sxx-sx*sx,a=den?((n*sxy-sx*sy)/den):0,b=(sy-a*sx)/n;return{a,b,x0}}
function onHomeyReady(Homey){const content=document.getElementById('content'),title=document.getElementById('title');let timer,busy=false,hasData=false;const deviceId=()=>((Homey.getDeviceIds()||[])[0]||'');const range=()=>((Homey.getSettings()||{}).range||'7d');function schedule(ms=60000){clearTimeout(timer);if(document.hidden)return;timer=setTimeout(run,ms)}async function run(){if(busy)return schedule(5000);busy=true;try{const data=await Homey.api('GET','/?deviceId='+encodeURIComponent(deviceId())+'&range='+encodeURIComponent(range()),{});draw(data);hasData=true}catch(e){if(!hasData)content.innerHTML='<div class="state error">'+esc(e.message||e)+'</div>'}finally{busy=false;schedule()}}
function draw(data){const l=lang(data.locale),w=words[l];title.textContent=w.title;let pts=(Array.isArray(data.history)?data.history:[]).map(p=>({t:Number(p.t),v:Number(p.v)})).filter(p=>Number.isFinite(p.t)&&Number.isFinite(p.v)).sort((a,b)=>a.t-b.t);const reg=regression(pts),perDay=reg.a||0,percentage=data.percentage;content.innerHTML='<div class="stats"><div class="stat"><span>'+esc(w.current)+'</span><strong>'+cfmt(data.endValue,l)+'</strong></div><div class="stat"><span>'+esc(w.change)+'</span><strong class="'+cls(data.change)+'">'+sign(data.change,l,0)+'</strong></div><div class="stat"><span>'+esc(w.percent)+'</span><strong class="'+cls(percentage)+'">'+(percentage===null?'—':sign(percentage,l,2)+'%')+'</strong></div><div class="stat"><span>'+esc(w.perDay)+'</span><strong class="'+cls(perDay)+'">'+sign(perDay,l,1)+'</strong></div></div><div class="chart"><div class="source">'+esc(data.historySource==='athom'?w.sourceAthom:w.sourceLocal)+'</div><div class="legend"><span>'+esc(w.actual)+'</span><span class="tl">'+esc(w.trend)+'</span></div><svg id="svg" viewBox="0 0 640 220" preserveAspectRatio="none"></svg>'+(pts.length<2?'<div class="hint">'+esc(w.building)+'</div>':'')+'</div>';drawChart(pts,reg,data,l)}
function drawChart(pts,reg,data,l){const svg=document.getElementById('svg');if(!svg||pts.length<2){if(svg)svg.innerHTML='';return}const shown=sample(pts),W=640,H=220,L=38,R=14,T=27,B=28,plotW=W-L-R,plotH=H-T-B,minT=shown[0].t,maxT=shown[shown.length-1].t===shown[0].t?shown[0].t+1:shown[shown.length-1].t;const trendStart=reg.b,trendEnd=reg.a*((maxT-reg.x0)/86400000)+reg.b;let vals=shown.map(p=>p.v).concat([trendStart,trendEnd]),minV=Math.min(...vals),maxV=Math.max(...vals);if(minV===maxV){minV-=1;maxV+=1}const pad=Math.max(1,(maxV-minV)*.12);minV-=pad;maxV+=pad;const x=t=>L+(t-minT)/(maxT-minT)*plotW,y=v=>T+(maxV-v)/(maxV-minV)*plotH;let grid='';for(let i=0;i<4;i++){const yy=T+i*(plotH/3);grid+='<line class="grid" x1="'+L+'" y1="'+yy+'" x2="'+(W-R)+'" y2="'+yy+'"/>'}const path=shown.map((p,i)=>(i?'L':'M')+x(p.t).toFixed(1)+' '+y(p.v).toFixed(1)).join(' '),area=path+' L'+x(shown[shown.length-1].t).toFixed(1)+' '+(T+plotH)+' L'+x(shown[0].t).toFixed(1)+' '+(T+plotH)+' Z',tPath='M'+x(minT).toFixed(1)+' '+y(trendStart).toFixed(1)+' L'+x(maxT).toFixed(1)+' '+y(trendEnd).toFixed(1),last=shown[shown.length-1],df=new Intl.DateTimeFormat((LOCALES[l]||'en-GB'),data.range==='24h'?{hour:'2-digit',minute:'2-digit',timeZone:data.timeZone}:{month:'short',day:'numeric',timeZone:data.timeZone});svg.innerHTML=grid+'<path class="area" d="'+area+'"/><path class="trend" d="'+tPath+'"/><path class="actual" d="'+path+'"/><circle class="dot" cx="'+x(last.t)+'" cy="'+y(last.v)+'" r="4"/><text class="axis" x="'+L+'" y="'+(H-8)+'">'+esc(df.format(new Date(minT)))+'</text><text class="axis" text-anchor="end" x="'+(W-R)+'" y="'+(H-8)+'">'+esc(df.format(new Date(maxT)))+'</text><text class="axis" x="2" y="'+(T+5)+'">'+esc(fmt(maxV,l,0))+'</text><text class="axis" x="2" y="'+(T+plotH)+'">'+esc(fmt(minV,l,0))+'</text>'}
document.addEventListener('visibilitychange',()=>{clearTimeout(timer);if(!document.hidden)run()});run().finally(()=>Homey.ready())}
</script></body></html>
