<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:var(--homey-background-color,#ffffff);color-scheme:light dark;--card:var(--homey-background-color,#f4f4f5);--header:var(--homey-background-color,#fafafa);--border:color-mix(in srgb,var(--bg) 88%,#000);--row:#fff;--primary:#232323;--secondary:#747378;--muted:#97969b;--title:#27435c;--positive:#18794e;--negative:#b32632;--positive-bg:#e5f5ed;--negative-bg:#fde9eb;--soft:color-mix(in srgb,var(--bg) 92%,#000)}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent;color:var(--primary);font:14px/1.28 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{display:grid;grid-template-rows:52px minmax(0,1fr);height:100%;border-radius:17px;overflow:hidden;background:var(--card)}header{display:flex;align-items:center;padding:0 18px;border-bottom:1px solid var(--border);background:var(--header)}.app{width:36px;height:36px;object-fit:contain}h1{margin:0 0 0 auto;color:var(--title);font-size:18px;font-weight:600;white-space:nowrap}#content{min-height:0;overflow-y:auto;padding:10px 12px 12px;scrollbar-width:none}#content::-webkit-scrollbar{display:none}.summary{display:flex;justify-content:space-between;gap:10px;margin:0 2px 8px;color:var(--secondary);font-size:10px}.list{display:grid;gap:7px}.row{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:9px;align-items:center;padding:8px 10px;border:1px solid var(--border);border-radius:11px;background:var(--row);cursor:pointer;transition:transform .12s ease}.row:active{transform:scale(.992)}.visual{position:relative;width:38px;height:38px}.appthumb{display:block;width:38px;height:38px;border-radius:10px;object-fit:contain;background:var(--soft);border:1px solid var(--border);padding:2px}.mark{position:absolute;right:-4px;bottom:-4px;display:grid;place-items:center;min-width:18px;height:18px;padding:0 4px;border-radius:9px;border:2px solid var(--row);font-size:7px;font-weight:900;line-height:1}.mark.up{color:var(--positive);background:var(--positive-bg)}.mark.down{color:var(--negative);background:var(--negative-bg)}.mark.info{color:var(--primary);background:var(--soft)}.meta{min-width:0}.name{font-weight:780;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{margin-top:2px;color:var(--secondary);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.delta{text-align:right}.delta strong{display:block;font-size:14px}.delta span{display:block;margin-top:2px;color:var(--muted);font-size:9px}.positive{color:var(--positive)}.negative{color:var(--negative)}.state{display:grid;place-items:center;height:100%;padding:20px;text-align:center;color:var(--title)}.error{color:#b32632}.modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:12px;background:rgba(0,0,0,.38);backdrop-filter:blur(3px)}.modal.open{display:flex}.sheet{width:min(100%,390px);max-height:calc(100% - 10px);overflow:auto;border:1px solid var(--border);border-radius:16px;background:var(--row);box-shadow:0 14px 40px rgba(0,0,0,.24)}.sheethead{display:grid;grid-template-columns:48px minmax(0,1fr) 32px;gap:10px;align-items:center;padding:13px;border-bottom:1px solid var(--border)}.sheeticon{width:48px;height:48px;border-radius:12px;object-fit:contain;background:var(--soft);padding:4px}.sheetname{font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sheetid{margin-top:2px;color:var(--muted);font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.close{display:grid;place-items:center;width:32px;height:32px;border:0;border-radius:16px;background:var(--soft);color:var(--primary);font-size:20px;line-height:1;cursor:pointer}.sheetbody{padding:12px}.sectiontitle{color:var(--secondary);font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}.changebox{margin-top:6px;padding:9px 10px;border:1px solid var(--border);border-radius:10px;background:var(--card)}.changebox strong{display:block;font-size:13px}.changebox span{display:block;margin-top:3px;color:var(--secondary);font-size:10px}.detailgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:7px}.detail{padding:8px 9px;border:1px solid var(--border);border-radius:10px;background:var(--card);min-width:0}.detail b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.detail span{display:block;margin-top:2px;color:var(--secondary);font-size:9px}.versionbox{margin-top:8px;padding:9px 10px;border:1px solid var(--border);border-radius:10px;background:var(--card)}.versionline{display:flex;justify-content:space-between;gap:10px;font-size:11px}.versionline+.versionline{margin-top:5px}.versionline span:first-child{color:var(--secondary)}
@media(prefers-color-scheme:dark){:root{--bg:#121b2b;--card:#121b2b;--header:#172338;--border:color-mix(in srgb,var(--bg) 84%,#fff);--row:color-mix(in srgb,var(--bg) 92%,#fff);--primary:#f4f4f5;--secondary:#b4c2d3;--muted:#8fa0b6;--title:#a9bdd3;--positive:#6ed7a7;--negative:#ff8a92;--positive-bg:#214435;--negative-bg:#4a292d;--soft:color-mix(in srgb,var(--bg) 86%,#fff)}}

</style></head><body>
<main class="card"><header><img class="app" src="icon.svg" alt=""><h1 id="title">Recente wijzigingen</h1></header><section id="content"><div class="state">…</div></section></main><div id="modal" class="modal" aria-hidden="true"><section class="sheet" role="dialog" aria-modal="true"><div class="sheethead"><img id="sheetIcon" class="sheeticon" src="icon.svg" alt=""><div><div id="sheetName" class="sheetname"></div><div id="sheetId" class="sheetid"></div></div><button id="closeModal" class="close" type="button" aria-label="Close">×</button></div><div id="sheetBody" class="sheetbody"></div></section></div>
<script>
const LOCALES={en:'en-GB',nl:'nl-NL',de:'de-DE',fr:'fr-FR',it:'it-IT',sv:'sv-SE',no:'nb-NO',es:'es-ES',da:'da-DK',pl:'pl-PL'};const words={nl:{title:'Recente wijzigingen',empty:'Nog geen activiteiten vastgelegd.',changes:'activiteiten',to:'naar',installs:'installaties',rating:'Beoordeling',live:'Live versie',test:'Testversie',review:'Reviewstatus',suggestion:'Nieuwe suggestie',devices:'Apparaten',build:'Nieuwe build',added:'App toegevoegd',deleted:'App verwijderd',change:'Wijziging',current:'Huidige appgegevens',cloud:'Cloud',local:'Lokaal',growth:'7d groei',suggestions:'Suggesties',builds:'Builds',age:'Live build leeftijd',days:'dagen',none:'Geen'},en:{title:'Recent Changes',empty:'No activity recorded yet.',changes:'activities',to:'to',installs:'installs',rating:'Rating',live:'Live version',test:'Test version',review:'Review state',suggestion:'New suggestion',devices:'Devices',build:'New build',added:'App added',deleted:'App removed',change:'Change',current:'Current app details',cloud:'Cloud',local:'Local',growth:'7d growth',suggestions:'Suggestions',builds:'Builds',age:'Live build age',days:'days',none:'None'},de:{title:'Letzte Änderungen',empty:'Noch keine Aktivitäten erfasst.',changes:'Aktivitäten',to:'auf',installs:'Installationen',rating:'Bewertung',live:'Live-Version',test:'Testversion',review:'Prüfstatus',suggestion:'Neuer Vorschlag',devices:'Geräte',build:'Neuer Build',added:'App hinzugefügt',deleted:'App entfernt',change:'Änderung',current:'Aktuelle App-Details',cloud:'Cloud',local:'Lokal',growth:'Wachstum 7 T.',suggestions:'Vorschläge',builds:'Builds',age:'Alter des Live-Builds',days:'Tage',none:'Keine'},fr:{title:'Changements récents',empty:'Aucune activité enregistrée pour le moment.',changes:'activités',to:'à',installs:'installations',rating:'Note',live:'Version live',test:'Version test',review:'État de la revue',suggestion:'Nouvelle suggestion',devices:'Appareils',build:'Nouveau build',added:'App ajoutée',deleted:'App supprimée',change:'Changement',current:'Détails actuels de l\'app',cloud:'Cloud',local:'Local',growth:'Croissance 7 j',suggestions:'Suggestions',builds:'Builds',age:'Âge du build live',days:'jours',none:'Aucun'},it:{title:'Modifiche recenti',empty:'Ancora nessuna attività registrata.',changes:'attività',to:'a',installs:'installazioni',rating:'Valutazione',live:'Versione live',test:'Versione di test',review:'Stato revisione',suggestion:'Nuovo suggerimento',devices:'Dispositivi',build:'Nuova build',added:'App aggiunta',deleted:'App rimossa',change:'Modifica',current:'Dettagli attuali dell\'app',cloud:'Cloud',local:'Locale',growth:'Crescita 7 g',suggestions:'Suggerimenti',builds:'Build',age:'Età della build live',days:'giorni',none:'Nessuno'},sv:{title:'Senaste ändringar',empty:'Ingen aktivitet registrerad än.',changes:'aktiviteter',to:'till',installs:'installationer',rating:'Betyg',live:'Liveversion',test:'Testversion',review:'Granskningsstatus',suggestion:'Nytt förslag',devices:'Enheter',build:'Nytt bygge',added:'App tillagd',deleted:'App borttagen',change:'Ändring',current:'Aktuella appdetaljer',cloud:'Moln',local:'Lokalt',growth:'Tillväxt 7 d',suggestions:'Förslag',builds:'Byggen',age:'Ålder på livebygge',days:'dagar',none:'Ingen'},no:{title:'Siste endringer',empty:'Ingen aktivitet registrert ennå.',changes:'aktiviteter',to:'til',installs:'installasjoner',rating:'Vurdering',live:'Liveversjon',test:'Testversjon',review:'Gjennomgangsstatus',suggestion:'Nytt forslag',devices:'Enheter',build:'Nytt bygg',added:'App lagt til',deleted:'App fjernet',change:'Endring',current:'Gjeldende appdetaljer',cloud:'Sky',local:'Lokalt',growth:'Vekst 7 d',suggestions:'Forslag',builds:'Bygg',age:'Alder på livebygg',days:'dager',none:'Ingen'},es:{title:'Cambios recientes',empty:'Todavía no se ha registrado actividad.',changes:'actividades',to:'a',installs:'instalaciones',rating:'Valoración',live:'Versión live',test:'Versión de prueba',review:'Estado de revisión',suggestion:'Nueva sugerencia',devices:'Dispositivos',build:'Nuevo build',added:'App añadida',deleted:'App eliminada',change:'Cambio',current:'Detalles actuales de la app',cloud:'Nube',local:'Local',growth:'Crecimiento 7 d',suggestions:'Sugerencias',builds:'Builds',age:'Antigüedad del build live',days:'días',none:'Ninguno'},da:{title:'Seneste ændringer',empty:'Ingen aktivitet registreret endnu.',changes:'aktiviteter',to:'til',installs:'installationer',rating:'Bedømmelse',live:'Liveversion',test:'Testversion',review:'Gennemgangsstatus',suggestion:'Nyt forslag',devices:'Enheder',build:'Ny build',added:'App tilføjet',deleted:'App fjernet',change:'Ændring',current:'Aktuelle appdetaljer',cloud:'Cloud',local:'Lokalt',growth:'Vækst 7 d',suggestions:'Forslag',builds:'Builds',age:'Alder på live-build',days:'dage',none:'Ingen'},pl:{title:'Ostatnie zmiany',empty:'Nie zarejestrowano jeszcze aktywności.',changes:'aktywności',to:'na',installs:'instalacji',rating:'Ocena',live:'Wersja live',test:'Wersja testowa',review:'Status recenzji',suggestion:'Nowa sugestia',devices:'Urządzenia',build:'Nowy build',added:'Dodano aplikację',deleted:'Usunięto aplikację',change:'Zmiana',current:'Bieżące szczegóły aplikacji',cloud:'Chmura',local:'Lokalnie',growth:'Wzrost 7 d',suggestions:'Sugestie',builds:'Buildy',age:'Wiek buildu live',days:'dni',none:'Brak'}};
function lang(v){return (l=>words[l]?l:'en')(String(v||'en').split('-')[0])}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function fmt(n,l,d=0){try{return new Intl.NumberFormat((LOCALES[l]||'en-GB'),{maximumFractionDigits:d}).format(Number(n)||0)}catch(_){return String(Number(n)||0)}}function sign(n,l){n=Number(n)||0;return(n>0?'+':'')+fmt(n,l)}function stamp(ts,l,tz){try{return new Intl.DateTimeFormat((LOCALES[l]||'en-GB'),{timeZone:tz,day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(Number(ts)))}catch(_){return''}}function appImg(item,v){return'<div class="visual"><img class="appthumb" src="'+esc(item.iconUrl||'icon.svg')+'" alt="" onerror="this.onerror=null;this.src=\'icon.svg\'"><span class="mark '+esc(v.cls)+'">'+esc(v.icon)+'</span></div>'}
function view(item,w,l){const t=item.type||'install';if(t==='install'){const up=Number(item.diff)>0;return{cls:up?'up':'down',icon:up?'↑':'↓',sub:fmt(item.from,l)+' '+w.to+' '+fmt(item.to,l)+' '+w.installs,right:sign(item.diff,l),rightCls:up?'positive':'negative'}}if(t==='rating')return{cls:'info',icon:'★',sub:w.rating+' '+fmt(item.from,l,1)+' '+w.to+' '+fmt(item.to,l,1),right:sign(item.diff,l),rightCls:Number(item.diff)>0?'positive':Number(item.diff)<0?'negative':''};if(t==='live_version')return{cls:'info',icon:'L',sub:w.live+' '+(item.from||'—')+' '+w.to+' '+(item.to||'—'),right:'v'+(item.to||'—')};if(t==='test_version')return{cls:'info',icon:'T',sub:w.test+' '+(item.from||'—')+' '+w.to+' '+(item.to||'—'),right:'v'+(item.to||'—')};if(t==='review_state')return{cls:'info',icon:'R',sub:w.review+' '+(item.from||'—')+' '+w.to+' '+(item.to||'—'),right:item.to||'—'};if(t==='suggestion')return{cls:'info',icon:'!',sub:item.detail||w.suggestion,right:w.suggestion};if(t==='devices')return{cls:'info',icon:'D',sub:w.devices+' '+fmt(item.from,l)+' '+w.to+' '+fmt(item.to,l),right:sign(item.diff,l),rightCls:Number(item.diff)>0?'positive':Number(item.diff)<0?'negative':''};if(t==='build')return{cls:'info',icon:'B',sub:item.detail||w.build,right:w.build};if(t==='app_added')return{cls:'up',icon:'+',sub:w.added,right:item.to||''};if(t==='app_deleted')return{cls:'down',icon:'×',sub:w.deleted,right:item.from||''};return{cls:'info',icon:'•',sub:item.detail||t,right:''}}
function onHomeyReady(Homey){const content=document.getElementById('content'),title=document.getElementById('title'),modal=document.getElementById('modal'),sheetIcon=document.getElementById('sheetIcon'),sheetName=document.getElementById('sheetName'),sheetId=document.getElementById('sheetId'),sheetBody=document.getElementById('sheetBody');let timer,busy=false,hasData=false,currentData=null,currentRows=[];const settings=()=>Homey.getSettings()||{};const deviceId=()=>((Homey.getDeviceIds()||[])[0]||'');function schedule(ms=60000){clearTimeout(timer);if(document.hidden)return;timer=setTimeout(run,ms)}
function closePopup(){modal.classList.remove('open');modal.setAttribute('aria-hidden','true')}
function openPopup(index){const item=currentRows[index],data=currentData;if(!item||!data)return;const l=lang(data.locale),w=words[l],v=view(item,w,l);sheetIcon.src=item.iconUrl||'icon.svg';sheetIcon.onerror=()=>{sheetIcon.onerror=null;sheetIcon.src='icon.svg'};sheetName.textContent=item.app||item.appId;sheetId.textContent=item.appId||'';const rating=item.hasRating?fmt(item.rating,l,2):'—',live=item.liveVersion?'v'+item.liveVersion:'—',test=item.testVersion?'v'+item.testVersion:'—',status=item.testState||w.none,age=Number(item.liveBuildAgeDays)?fmt(item.liveBuildAgeDays,l)+' '+w.days:'—';sheetBody.innerHTML='<div class="sectiontitle">'+esc(w.change)+'</div><div class="changebox"><strong>'+esc(v.sub)+'</strong><span>'+esc(v.right||'')+(v.right?' · ':'')+esc(stamp(item.t,l,data.timeZone))+'</span></div><div class="sectiontitle" style="margin-top:12px">'+esc(w.current)+'</div><div class="detailgrid"><div class="detail"><b>'+fmt(item.installs,l)+'</b><span>'+esc(w.installs)+'</span></div><div class="detail"><b class="'+(Number(item.growth7d)>0?'positive':Number(item.growth7d)<0?'negative':'')+'">'+esc(item.growth7d===null||item.growth7d===undefined?'—':sign(item.growth7d,l))+'</b><span>'+esc(w.growth)+'</span></div><div class="detail"><b>'+fmt(item.cloud,l)+'</b><span>'+esc(w.cloud)+'</span></div><div class="detail"><b>'+fmt(item.local,l)+'</b><span>'+esc(w.local)+'</span></div><div class="detail"><b>'+fmt(item.deviceCount,l)+'</b><span>'+esc(w.devices)+'</span></div><div class="detail"><b>'+esc(rating)+'</b><span>'+esc(w.rating)+'</span></div><div class="detail"><b>'+fmt(item.suggestionsCount,l)+'</b><span>'+esc(w.suggestions)+'</span></div><div class="detail"><b>'+fmt(item.buildCount,l)+'</b><span>'+esc(w.builds)+'</span></div></div><div class="versionbox"><div class="versionline"><span>'+esc(w.live)+'</span><strong>'+esc(live)+'</strong></div><div class="versionline"><span>'+esc(w.test)+'</span><strong>'+esc(test)+'</strong></div><div class="versionline"><span>'+esc(w.review)+'</span><strong>'+esc(status)+'</strong></div><div class="versionline"><span>'+esc(w.age)+'</span><strong>'+esc(age)+'</strong></div></div>';modal.classList.add('open');modal.setAttribute('aria-hidden','false')}
document.getElementById('closeModal').addEventListener('click',closePopup);modal.addEventListener('click',e=>{if(e.target===modal)closePopup()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closePopup()});
async function run(){if(busy)return schedule(5000);busy=true;try{const s=settings(),data=await Homey.api('GET','/?deviceId='+encodeURIComponent(deviceId())+'&range='+encodeURIComponent(s.range||'7d')+'&filter='+encodeURIComponent(s.filter||'all'),{});draw(data);hasData=true}catch(e){if(!hasData)content.innerHTML='<div class="state error">'+esc(e.message||e)+'</div>'}finally{busy=false;schedule()}}
function draw(data){const l=lang(data.locale),w=words[l],rows=Array.isArray(data.changes)?data.changes:[];currentData=data;currentRows=rows;title.textContent=w.title;if(!rows.length){content.innerHTML='<div class="state">'+esc(w.empty)+'</div>';return}let html='<div class="summary"><span>'+fmt(rows.length,l)+' '+esc(w.changes)+'</span><span>'+esc(data.organization||data.name||'')+'</span></div><div class="list">';for(const [index,item] of rows.entries()){const v=view(item,w,l);html+='<article class="row" data-change-index="'+index+'" tabindex="0">'+appImg(item,v)+'<div class="meta"><div class="name">'+esc(item.app||item.appId)+'</div><div class="sub">'+esc(v.sub)+'</div></div><div class="delta"><strong class="'+esc(v.rightCls||'')+'">'+esc(v.right||'')+'</strong><span>'+esc(stamp(item.t,l,data.timeZone))+'</span></div></article>'}html+='</div>';content.innerHTML=html;content.querySelectorAll('[data-change-index]').forEach(el=>{const open=()=>openPopup(Number(el.dataset.changeIndex));el.addEventListener('click',open);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}})})}
document.addEventListener('visibilitychange',()=>{clearTimeout(timer);if(!document.hidden)run()});run().finally(()=>Homey.ready())}
</script></body></html>
