<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:var(--homey-background-color,#ffffff);color-scheme:light dark;--card:var(--homey-background-color,#f4f4f5);--header:var(--homey-background-color,#fafafa);--border:color-mix(in srgb,var(--bg) 88%,#000);--row:#fff;--primary:#232323;--secondary:#747378;--muted:#97969b;--title:#27435c;--bar:color-mix(in srgb,var(--bg) 90%,#000);--fill:#10a37f;--badge:color-mix(in srgb,var(--bg) 92%,#000);--positive:#18794e;--negative:#b32632}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent;color:var(--primary);font:14px/1.28 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{display:grid;grid-template-rows:52px minmax(0,1fr);height:100%;border-radius:17px;overflow:hidden;background:var(--card)}header{display:flex;align-items:center;padding:0 18px;border-bottom:1px solid var(--border);background:var(--header)}.app{width:36px;height:36px;object-fit:contain}h1{margin:0 0 0 auto;color:var(--title);font-size:18px;font-weight:600;white-space:nowrap}#content{min-height:0;overflow-y:auto;padding:10px 12px 12px;scrollbar-width:none}#content::-webkit-scrollbar{display:none}.summary{display:flex;justify-content:space-between;gap:10px;margin:0 2px 8px;color:var(--secondary);font-size:10px}.list{display:grid;gap:7px}.row{padding:8px 10px;border:1px solid var(--border);border-radius:11px;background:var(--row)}.top{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:9px;align-items:center}.appthumb{display:block;width:34px;height:34px;border-radius:9px;object-fit:contain;background:var(--badge);padding:2px}.name{font-weight:780;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.goal{text-align:right;font-weight:800}.sub{display:flex;justify-content:space-between;gap:10px;margin-top:3px;color:var(--secondary);font-size:10px}.sub span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar{height:7px;margin-top:7px;border-radius:999px;background:var(--bar);overflow:hidden}.fill{height:100%;border-radius:999px;background:var(--fill);min-width:2px;transition:width .25s ease}.positive{color:var(--positive)}.negative{color:var(--negative)}.state{display:grid;place-items:center;height:100%;padding:20px;text-align:center;color:var(--title)}.error{color:#b32632}
@media(prefers-color-scheme:dark){:root{--bg:#121b2b;--card:#121b2b;--header:#172338;--border:color-mix(in srgb,var(--bg) 84%,#fff);--row:color-mix(in srgb,var(--bg) 92%,#fff);--primary:#f4f4f5;--secondary:#b4c2d3;--muted:#8fa0b6;--title:#a9bdd3;--bar:color-mix(in srgb,var(--bg) 84%,#fff);--fill:#2fd29a;--badge:color-mix(in srgb,var(--bg) 86%,#fff);--positive:#6ed7a7;--negative:#ff8a92}}

</style></head><body>
<main class="card"><header><img class="app" src="icon.svg" alt=""><h1 id="title">Mijlpalen</h1></header><section id="content"><div class="state">…</div></section></main>
<script>
const LOCALES={en:'en-GB',nl:'nl-NL',de:'de-DE',fr:'fr-FR',it:'it-IT',sv:'sv-SE',no:'nb-NO',es:'es-ES',da:'da-DK',pl:'pl-PL'};const words={nl:{title:'Mijlpalen',empty:'Geen apps gevonden.',remaining:'te gaan',account:'Account',eta:'ETA',days:'dagen',growth:'7d groei',updated:'Bijgewerkt',step:'stap'},en:{title:'Milestones',empty:'No apps found.',remaining:'to go',account:'Account',eta:'ETA',days:'days',growth:'7d growth',updated:'Updated',step:'step'},de:{title:'Meilensteine',empty:'Keine Apps gefunden.',remaining:'verbleibend',account:'Konto',eta:'Voraussichtlich',days:'Tage',growth:'Wachstum 7 T.',updated:'Aktualisiert',step:'Stufe'},fr:{title:'Jalons',empty:'Aucune app trouvée.',remaining:'restantes',account:'Compte',eta:'Estimation',days:'jours',growth:'Croissance 7 j',updated:'Mis à jour',step:'étape'},it:{title:'Traguardi',empty:'Nessuna app trovata.',remaining:'mancanti',account:'Account',eta:'Stima',days:'giorni',growth:'Crescita 7 g',updated:'Aggiornato',step:'fase'},sv:{title:'Milstolpar',empty:'Inga appar hittades.',remaining:'kvar',account:'Konto',eta:'Beräknat',days:'dagar',growth:'Tillväxt 7 d',updated:'Uppdaterad',step:'steg'},no:{title:'Milepæler',empty:'Ingen apper funnet.',remaining:'igjen',account:'Konto',eta:'Estimert',days:'dager',growth:'Vekst 7 d',updated:'Oppdatert',step:'steg'},es:{title:'Hitos',empty:'No se encontraron apps.',remaining:'restantes',account:'Cuenta',eta:'Estimado',days:'días',growth:'Crecimiento 7 d',updated:'Actualizado',step:'etapa'},da:{title:'Milepæle',empty:'Ingen apps fundet.',remaining:'tilbage',account:'Konto',eta:'Forventet',days:'dage',growth:'Vækst 7 d',updated:'Opdateret',step:'trin'},pl:{title:'Kamienie milowe',empty:'Nie znaleziono aplikacji.',remaining:'pozostało',account:'Konto',eta:'Szacunkowo',days:'dni',growth:'Wzrost 7 d',updated:'Zaktualizowano',step:'etap'}};
function lang(v){return (l=>words[l]?l:'en')(String(v||'en').split('-')[0])}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function fmt(n,l){try{return new Intl.NumberFormat((LOCALES[l]||'en-GB')).format(Number(n)||0)}catch(_){return String(Number(n)||0)}}function cls(n){return n===null||n===undefined?'':Number(n)>0?'positive':Number(n)<0?'negative':''}function sign(n,l){if(n===null||n===undefined)return'—';n=Number(n)||0;return(n>0?'+':'')+fmt(n,l)}function time(ts,l,tz){try{return new Intl.DateTimeFormat((LOCALES[l]||'en-GB'),{timeZone:tz,hour:'2-digit',minute:'2-digit'}).format(new Date(Number(ts)||Date.now()))}catch(_){return''}}function img(u){return'<img class="appthumb" src="'+esc(u||'icon.svg')+'" alt="" onerror="this.onerror=null;this.src=\'icon.svg\'">'}
function onHomeyReady(Homey){const content=document.getElementById('content'),title=document.getElementById('title');let timer,busy=false,hasData=false;const deviceId=()=>((Homey.getDeviceIds()||[])[0]||'');const settings=()=>Homey.getSettings()||{};function schedule(ms=60000){clearTimeout(timer);if(document.hidden)return;timer=setTimeout(run,ms)}async function run(){if(busy)return schedule(5000);busy=true;try{const s=settings(),data=await Homey.api('GET','/?deviceId='+encodeURIComponent(deviceId())+'&count='+encodeURIComponent(s.count||'6'),{});draw(data);hasData=true}catch(e){if(!hasData)content.innerHTML='<div class="state error">'+esc(e.message||e)+'</div>'}finally{busy=false;schedule()}}
function draw(data){const l=lang(data.locale),w=words[l],apps=Array.isArray(data.apps)?data.apps:[];title.textContent=w.title;if(!apps.length){content.innerHTML='<div class="state">'+esc(w.empty)+'</div>';return}let html='<div class="summary"><span>'+esc(data.name||'')+'</span><span>'+esc(w.updated)+' '+esc(time(data.updatedAt,l,data.timeZone))+'</span></div><div class="list">';for(const a of apps){const pct=Math.max(0,Math.min(100,Number(a.stageProgress||0)*100)),growth=a.growth7d===null?'—':sign(a.growth7d,l),eta=a.etaDays?' · '+w.eta+' '+fmt(a.etaDays,l)+' '+w.days:'';html+='<article class="row"><div class="top">'+img(a.iconUrl)+'<div class="name">'+esc(a.name||a.id)+'</div><div class="goal">'+fmt(a.installs,l)+' / '+fmt(a.target,l)+'</div></div><div class="sub"><span class="'+cls(a.growth7d)+'">'+esc(w.growth)+' '+esc(growth)+esc(eta)+'</span><span>'+fmt(a.remaining,l)+' '+esc(w.remaining)+'</span></div><div class="bar" title="'+esc(fmt(a.previous,l)+' → '+fmt(a.target,l))+'"><div class="fill" style="width:'+pct.toFixed(2)+'%"></div></div></article>'}html+='</div>';content.innerHTML=html}
document.addEventListener('visibilitychange',()=>{clearTimeout(timer);if(!document.hidden)run()});run().finally(()=>Homey.ready())}
</script></body></html>
